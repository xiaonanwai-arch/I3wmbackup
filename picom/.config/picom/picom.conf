backend = "glx";
use-damage = true;
vsync = true;

corner-radius = 12;

blur: {
  method = "dual_kawase";
  strength = 6;
  background = true;
  background-frame = false;
  background-fixed = false;
}

rules = (
  {
    match = "window_type = 'desktop' || _GTK_FRAME_EXTENTS@";
    blur-background = false;
  },
  {
    match = "window_type = 'dock' || window_type = 'desktop' || class_g = 'Polybar' || class_g = 'i3bar'";
    corner-radius = 0;
    shadow = false;
    blur-background = false;
  },
  {
    match = "name = 'Notification' || class_g = 'Conky' || class_g ?= 'Notify-osd' || class_g = 'Cairo-clock' || _GTK_FRAME_EXTENTS@";
    shadow = false;
  }
);

fading = true;
fade-delta = 4;
fade-in-step = 0.03;
fade-out-step = 0.03;

