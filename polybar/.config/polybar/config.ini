include-file = ~/.config/polybar/colors.ini

[bar/main]
width = 100%
height = 20pt
radius = 9

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt

border-size = 4pt
border-color = #00000000

padding-left = 2
padding-right = 2
module-margin = 1

font-0 = "ComicShannsMono Nerd Font Propo:style=Bold:size=10.2;2"

modules-left = arch date
modules-center = i3  
modules-right = systray wlan pulseaudio battery

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
override-redirect = true
wm-restack = generic


[module/arch]
type = custom/script
exec = echo " kai"
exec-if = true

format-prefix = "󰣇 "
format-prefix-foreground = ${colors.arch-icon}
format-foreground = ${colors.foreground}
click-left = /home/kai/.config/rofi/launchers/type-2/launcher.sh
click-right = /home/kai/.config/rofi/powermenu/type-1/powermenu.sh


[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

format-prefix = " "
format-prefix-foreground = ${colors.time-text}
label = %date%
label-foreground = ${colors.foreground}


[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
index-sort = true

;; Focused workspace gets a distinct color pop
label-focused = 
label-focused-foreground = ${colors.primary}
label-focused-padding = 1

;; Unfocused workspaces fall back gracefully into the deep brown tone
label-unfocused = 
label-unfocused-foreground = ${colors.secondary}
label-unfocused-padding = 1

;; Urgent notification state
label-urgent = 
label-urgent-foreground = ${colors.alert}
label-urgent-padding = 1


; [module/wlan]
; type = custom/script
; exec = iwgetid -r || echo "Disconnected"
; interval = 3
; format-prefix = " "
; format-prefix-foregrphone-monitoround = ${colors.network-icon}
; format = <label>
; label = %output%
; label-foreground = ${colors.foreground}
; click-left = /home/kai/.config/rofi/applets/bin/wifi.sh

[module/wlan]
type = custom/script
exec = ~/.config/polybar/scripts/wifi.sh
interval = 3

format = <label>
format-prefix = " "
format-prefix-foreground = ${colors.network-icon}

label = %output%
label-foreground = ${colors.foreground}
click-left = nm-connection-editor


[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
format-volume-prefix = " "
format-volume-prefix-foreground = ${colors.audio-icon}
label-volume = %percentage%%
label-volume-foreground = ${colors.foreground}
format-muted = <label-muted>
format-muted-prefix = " "
format-muted-prefix-foreground = ${colors.disabled}
label-muted = Muted
label-muted-foreground = ${colors.disabled}
click-right = pavucontrol


; [module/battery]
; type = custom/script
; exec = acpi -b | cut -d',' -f2 | tr -d ' '
; interval = 5
; format-prefix = "󰁹 "
; format-prefix-foreground = ${colors.battery-icon}
; label = %output%
; label-foreground = ${colors.foreground}
; click-left = /home/kai/.config/rofi/applets/bin/battery.sh
; click-right = /home/kai/.config/rofi/applets/bin/brightness.sh

[module/battery]
type = custom/script
exec = ~/.config/polybar/scripts/battery.sh
interval = 2
label = %output%
label-foreground = ${colors.foreground}
click-left = /home/kai/.config/rofi/applets/bin/battery.sh
click-right = /home/kai/.config/rofi/applets/bin/brightness.sh

[module/systray]
type = internal/tray
tray-spacing = 8px
tray-size = 16

[settings]
screenchange-reload = true
pseudo-transparency = false

